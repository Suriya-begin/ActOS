version: "3.9"

services:

  # ── FASTAPI BACKEND ─────────────────────────────────────────
  backend:
    build: ../../backend
    container_name: actos-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://actos_user:actos_password@postgres:5432/actos_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NATS_URL=nats://nats:4222
    depends_on:
      - postgres
      - redis
      - kafka
      - nats
    volumes:
      - ../../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── POSTGRESQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: actos-postgres
    environment:
      POSTGRES_DB: actos_db
      POSTGRES_USER: actos_user
      POSTGRES_PASSWORD: actos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── REDIS ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: actos-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # ── KAFKA (Distributed event bus — Phase 5) ─────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: actos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: actos-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ── NATS ────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: actos-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--http_port 8222"

  # ── WEAVIATE (Vector DB backup) ─────────────────────────────
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.25.1
    container_name: actos-weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
    volumes:
      - weaviate_data:/var/lib/weaviate

  # ── NEXT.JS FRONTEND ────────────────────────────────────────
  frontend:
    build: ../../frontend
    container_name: actos-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
